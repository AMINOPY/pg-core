name: Android Go mobile bridge

on:
  pull_request:
    paths:
      - "mobile/**"
      - "internal/engine/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android-mobile-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mobile-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          # sdkmanager exits after all licenses are accepted, which can close
          # the pipe before yes exits; keep the SDK manager's status authoritative.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install pinned Go mobile binding tools
        env:
          MOBILE_VERSION: "v0.0.0-20261011034528-197770444867"
        run: |
          set -euo pipefail
          # Newer gomobile requires x/mobile to be a package in this module's
          # dependency graph, not merely present as a globally installed tool.
          go get -tool "golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION"
          gomobile init
      - name: Build Android AAR from mobile engine
        run: |
          set -euo pipefail
          gomobile bind -v -target=android -androidapi 23 -javapkg dev.pgcore.mobile -o mobile-engine.aar ./mobile
          test -s mobile-engine.aar
      - name: Inspect generated binding API
        run: |
          set -euo pipefail
          unzip -p mobile-engine.aar classes.jar > mobile-engine-classes.jar
          jar tf mobile-engine-classes.jar > mobile-engine-classes.txt
          grep -E '(Engine|SocketProtector)\.class$' mobile-engine-classes.txt
          : > mobile-engine-api.txt
          while IFS= read -r entry; do
            class_name="${entry%.class}"
            class_name="${class_name//\//.}"
            javap -classpath mobile-engine-classes.jar "$class_name" >> mobile-engine-api.txt
          done < <(grep -E '(Engine|SocketProtector)\.class$' mobile-engine-classes.txt)
          grep -E 'start\(|Start\(|protect\(|Protect\(|addr\(|Addr\(|health\(|Health\(|stop\(|Stop\(' mobile-engine-api.txt
      - name: Upload generated bridge and API contract
        uses: actions/upload-artifact@v4
        with:
          name: pgcore-mobile-engine-android-aar
          path: |
            mobile-engine.aar
            mobile-engine-api.txt
            mobile-engine-classes.txt
          if-no-files-found: error
          retention-days: 14
