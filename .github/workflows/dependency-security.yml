name: Dependency Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false
      - name: Scan Go packages for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
