name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Python corecheck tests
        run: python -m unittest discover -s tools/corecheck -p 'test_*.py'
      - name: Python control API SDK tests
        run: python -m unittest discover -s integrations/python -p 'test_*.py'
      - name: Native C ABI tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic native/cdn_validation.c native/test_cdn_validation.c -o /tmp/pg-core-c-test
          /tmp/pg-core-c-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic native/fusion_frame.c native/test_fusion_frame.c -o /tmp/pg-core-fusion-test
          /tmp/pg-core-fusion-test
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "These Go files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Integration package tests
        run: go test ./pkg/integration
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Native tunnel benchmark smoke test
        run: go test -run '^$' -bench '^BenchmarkWebSocketTunnelWrite$' -benchtime=1x ./internal/engine/native
      - name: Windows cross-compile tests
        run: GOOS=windows GOARCH=amd64 go test -exec=true ./...
      - name: Linux ARM64 cross-compile tests
        run: GOOS=linux GOARCH=arm64 go test -exec=true ./...
      - name: Race detector
        run: go test -race ./...
