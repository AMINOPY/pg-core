name: Chimera CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "These Go files need gofmt:"
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Run Go race tests
        run: go test -race ./...

  python:
    name: Python client tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Python client
        working-directory: integrations/python
        run: python -m unittest -v

  java:
    name: Java client tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test Java client
        working-directory: integrations/java
        run: mvn --batch-mode test

  kotlin:
    name: Kotlin client tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test Kotlin client
        working-directory: integrations/kotlin
        run: gradle test
