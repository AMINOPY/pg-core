name: Android Kotlin CI

on:
  pull_request:
    paths:
      - "android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-kotlin.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-kotlin.yml"

permissions:
  contents: read

jobs:
  android-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android Kotlin library
        run: gradle --no-daemon :android:assembleDebug
      - name: Run Android Kotlin unit tests
        run: gradle --no-daemon :android:testDebugUnitTest
