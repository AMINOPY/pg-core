name: Android Kotlin CI

on:
  pull_request:
    paths:
      - "android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-kotlin.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-kotlin.yml"

permissions:
  contents: read

jobs:
  android-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android Kotlin library
        run: gradle --no-daemon :android:assembleDebug
